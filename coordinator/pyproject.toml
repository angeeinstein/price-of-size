[project]
name = "pos-coordinator"
version = "0.1.0"
description = "Coordinator API, planner and LLM service for The Price of Size"
requires-python = ">=3.12"
dependencies = [
  "pos-shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pydantic-settings>=2.4",
  "cryptography>=43",
]

[project.scripts]
pos-coordinator = "pos_coordinator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pos_coordinator"]
