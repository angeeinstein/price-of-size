# Local development database (PostgreSQL 16 + pgvector) for running tests.
#   docker compose -f deploy/dev/docker-compose.yml up -d
# Production runs PostgreSQL natively in its own LXC (see docs/spec.md).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos_test
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
