[project]
name = "pos-worker"
version = "0.1.0"
description = "Worker node for The Price of Size"
requires-python = ">=3.12"
dependencies = [
  "pos-shared",
  "httpx>=0.27",
  "cryptography>=43",
  "pydantic-settings>=2.4",
  "zstandard>=0.23",
  "lxml>=5.3",
  "httpcore>=1.0",
  "anyio>=4",
  "onnxruntime>=1.32.0",
  "tokenizers>=0.23.3",
  "numpy>=2.5.5",
]

[project.scripts]
pos-worker = "pos_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pos_worker"]
