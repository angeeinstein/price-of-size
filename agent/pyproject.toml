[project]
name = "pos-agent"
version = "0.1.0"
description = "Node agent (A/B updater) for The Price of Size"
requires-python = ">=3.12"
dependencies = ["pos-shared", "httpx>=0.27", "pydantic-settings>=2.4"]

[project.scripts]
pos-agent = "pos_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pos_agent"]
