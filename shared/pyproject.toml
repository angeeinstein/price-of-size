[project]
name = "pos-shared"
version = "0.1.0"
description = "Shared schemas, ids and rules for The Price of Size"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pos_shared"]
