[project]
name = "pos-shared"
version = "0.1.0"
description = "Shared schemas, ids and rules for The Price of Size"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "cryptography>=43",
    "lxml>=5.3",
    "numpy>=2.5.5",
    "cssselect>=1.2",
    "regex>=2024.11.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pos_shared"]
